<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <!-- 前端大菱形（白面，锋锐等边） -->
  <path d="M9,2 L16,9 L9,16 L2,9 Z" fill="url(#top)" stroke="#0F1B3D" stroke-width="1.5" stroke-linejoin="miter"/>
  <!-- 尾部小菱形（浅蓝，锋锐等边，接在大菱形尾部向外延伸） -->
  <path d="M15,10.5 L19.5,15 L15,19.5 L10.5,15 Z" fill="url(#side)" stroke="#0F1B3D" stroke-width="1.5" stroke-linejoin="miter"/>
</svg>