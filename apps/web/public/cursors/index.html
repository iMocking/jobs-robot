<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JobHub 光标系统 v4</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Rajdhani", "Orbitron", "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    color: #E8F0FF;
    overflow-x: hidden;
    background-color: #060B1A;
    background-image:
      linear-gradient(rgba(56,189,248,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(56,189,248,.045) 1px, transparent 1px),
      radial-gradient(680px 400px at 10% -8%, rgba(56,189,248,.13), transparent 62%),
      radial-gradient(600px 400px at 92% 10%, rgba(59,130,246,.11), transparent 62%);
    background-size: 48px 48px, 48px 48px, auto, auto;
    padding: 56px 44px 64px;
  }
  .wrap { max-width: 1220px; margin: 0 auto; }
  header { margin-bottom: 44px; position: relative; }
  .kicker {
    display: inline-flex; align-items: center; gap: 12px;
    font-size: 11px; letter-spacing: 7px; font-weight: 600;
    color: #7DD3FC;
    background: rgba(13,26,58,.5);
    border: 1px solid rgba(125,211,252,.35);
    border-left: 3px solid #38BDF8;
    padding: 8px 18px 8px 14px;
    margin-bottom: 22px;
  }
  .kicker::before { content: '▮'; font-size: 10px; color: #38BDF8; }
  h1 {
    font-size: 48px; font-weight: 700; letter-spacing: 5px;
    color: #FFFFFF;
    text-shadow: 0 0 24px rgba(56,189,248,.35);
  }
  h1 i {
    font-style: normal; font-weight: 600; font-size: 30px; letter-spacing: 3px;
    color: #7DD3FC; margin-left: 14px;
  }
  .sub {
    margin-top: 12px; font-size: 14px; letter-spacing: 1px;
    color: rgba(165,203,245,.75); max-width: 860px; line-height: 1.9;
  }
  .sub b { color: #FFFFFF; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(224px, 1fr)); gap: 20px; }
  .card {
    position: relative;
    background: linear-gradient(168deg, rgba(15,29,64,.55), rgba(8,14,34,.78));
    padding: 26px 18px 20px;
    text-align: center;
    border: 1px solid rgba(125,211,252,.16);
    border-top: 2px solid rgba(56,189,248,.5);
    clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
    transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease, background .16s ease;
  }
  .card::before {
    content: ''; position: absolute; top: -2px; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, #38BDF8, transparent 60%);
    opacity: 0; transition: opacity .16s ease;
  }
  .card:hover {
    transform: translateY(-3px);
    border-color: rgba(125,211,252,.42);
    background: linear-gradient(168deg, rgba(18,34,74,.65), rgba(10,17,40,.85));
    box-shadow: 0 0 0 1px rgba(56,189,248,.12), 0 0 28px rgba(56,189,248,.16), 0 14px 32px rgba(2,6,18,.5);
  }
  .card:hover::before { opacity: 1; }
  .icon {
    width: 116px; height: 116px; margin: 0 auto 14px;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(76px 76px at 50% 42%, rgba(56,189,248,.09), transparent 70%), rgba(255,255,255,.02);
    border: 1px solid rgba(125,211,252,.13);
    clip-path: polygon(0 0, calc(100% - 11px) 0, 100% 11px, 100% 100%, 11px 100%, 0 calc(100% - 11px));
  }
  .card:hover .icon { border-color: rgba(125,211,252,.36); }
  .icon img { width: 92px; height: 92px; display: block; }
  .name { font-size: 16px; font-weight: 700; letter-spacing: 2px; color: #FFFFFF; }
  .name em { font-style: normal; font-weight: 500; font-size: 11px; letter-spacing: 2.5px; color: #7DD3FC; margin-left: 8px; }
  .cls {
    margin-top: 10px; font-size: 11px; letter-spacing: .5px;
    color: #A5B4FC;
    font-family: "JetBrains Mono", Consolas, monospace;
    background: rgba(6,11,26,.55); border: 1px solid rgba(125,211,252,.18);
    border-left: 2px solid #38BDF8;
    padding: 4px 10px;
    display: inline-block;
  }
  .desc { margin-top: 9px; font-size: 11.5px; letter-spacing: 2.5px; color: rgba(148,178,225,.55); }
  footer {
    margin-top: 40px; font-size: 12px; letter-spacing: 3px; color: rgba(125,211,252,.55);
    display: flex; align-items: center; gap: 10px;
  }
  footer::before { content: '▮'; font-size: 10px; color: #38BDF8; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="kicker">JOBHUB SYSTEM · V4</span>
    <h1>光标系统<i>KURO CURSOR</i></h1>
    <p class="sub">鸣潮式审美：<b>菱形圆润箭头</b>、白主体 + 深轮廓 + 浅蓝亮线、克制辉光 —— 简洁圆润，悬停任意卡片体验对应光标。</p>
  </header>

  <div class="grid" id="grid"></div>

  <footer>SYSTEM ASSETS: public/cursors/*.svg · 32×32 VIEWBOX · FINE WHITE · KURO STYLE</footer>
</div>

<script>
const ITEMS = [
  ['arrow', '常规', 'Arrow', '.cursor-default', 'var(--cur-arrow), auto'],
  ['pointer', '可点击', 'Pointer', '.cursor-pointer', 'var(--cur-pointer), pointer'],
  ['text', '文本', 'Text', '.cursor-text', 'var(--cur-text), text'],
  ['copy', '复制', 'Copy', '.cursor-copy', 'var(--cur-copy), copy'],
  ['move', '移动', 'Move', '.cursor-move', 'var(--cur-move), move'],
  ['not-allowed', '禁止', 'Not Allowed', '.cursor-not-allowed', 'var(--cur-not-allowed), not-allowed'],
  ['grab', '抓取', 'Grab', '.cursor-grab', 'var(--cur-grab), grab'],
  ['grabbing', '握紧', 'Grabbing', '.cursor-grabbing', 'var(--cur-grabbing), grabbing'],
  ['progress', '进行中', 'Progress', '.cursor-progress', 'var(--cur-progress), progress'],
  ['wait', '等待', 'Wait', '.cursor-wait', 'var(--cur-wait), wait'],
  ['resize-ew', '横向缩放', 'EW', '.cursor-resize-ew', 'var(--cur-resize-ew), ew-resize'],
  ['resize-ns', '纵向缩放', 'NS', '.cursor-resize-ns', 'var(--cur-resize-ns), ns-resize'],
  ['resize-nesw', '斜向缩放', 'NESW', '.cursor-resize-nesw', 'var(--cur-resize-nesw), nesw-resize'],
  ['resize-nwse', '斜向缩放', 'NWSE', '.cursor-resize-nwse', 'var(--cur-resize-nwse), nwse-resize'],
  ['crosshair', '准星', 'Crosshair', '.cursor-crosshair', 'var(--cur-crosshair), crosshair'],
  ['zoom-in', '放大', 'Zoom In', '.cursor-zoom-in', 'var(--cur-zoom-in), zoom-in'],
  ['zoom-out', '缩小', 'Zoom Out', '.cursor-zoom-out', 'var(--cur-zoom-out), zoom-out'],
];
const grid = document.getElementById('grid');
for (const [file, cn, en, cls, css] of ITEMS) {
  const card = document.createElement('div');
  card.className = 'card';
  card.style.cursor = css;
  card.innerHTML =
    '<div class="icon"><img src="/cursors/' + file + '.svg" alt="' + en + '"></div>' +
    '<div class="name">' + cn + '<em>' + en + '</em></div>' +
    '<div><span class="cls">' + cls + '</span></div>' +
    '<div class="desc">' + en + '</div>';
  grid.appendChild(card);
}
</script>
</body>
</html>
