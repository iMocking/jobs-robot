<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JobHub 光标系统 v7</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Rajdhani", "Orbitron", "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    color: #0F1B3D;
    overflow-x: hidden;
    background:
      radial-gradient(720px 420px at 12% -10%, rgba(255,255,255,.55), transparent 60%),
      radial-gradient(640px 420px at 94% 8%, rgba(125,211,252,.35), transparent 62%),
      linear-gradient(160deg, #BFE9D6 0%, #A8DCD0 48%, #9BD8D6 100%);
    padding: 56px 44px 64px;
  }
  .wrap { max-width: 1220px; margin: 0 auto; }
  header { margin-bottom: 44px; }
  .kicker {
    display: inline-flex; align-items: center; gap: 12px;
    font-size: 11px; letter-spacing: 7px; font-weight: 600;
    color: #1D4ED8;
    background: rgba(255,255,255,.55);
    border: 1px solid rgba(37,99,235,.25);
    border-left: 3px solid #2563EB;
    padding: 8px 18px 8px 14px;
    margin-bottom: 22px;
    backdrop-filter: blur(4px);
  }
  .kicker::before { content: '▮'; font-size: 10px; color: #2563EB; }
  h1 {
    font-size: 48px; font-weight: 700; letter-spacing: 5px;
    color: #0F1B3D;
  }
  h1 i {
    font-style: normal; font-weight: 600; font-size: 30px; letter-spacing: 3px;
    color: #2563EB; margin-left: 14px;
  }
  .sub {
    margin-top: 12px; font-size: 14px; letter-spacing: 1px;
    color: rgba(15,27,61,.66); max-width: 860px; line-height: 1.9;
  }
  .sub b { color: #1D4ED8; font-weight: 700; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(224px, 1fr)); gap: 20px; }
  .card {
    position: relative;
    background: rgba(255,255,255,.62);
    padding: 26px 18px 20px;
    text-align: center;
    border: 1px solid rgba(37,99,235,.14);
    border-radius: 14px;
    backdrop-filter: blur(6px);
    box-shadow: 0 6px 18px rgba(15,27,61,.06);
    transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
  }
  .card:hover {
    transform: translateY(-3px);
    background: rgba(255,255,255,.82);
    box-shadow: 0 10px 26px rgba(37,99,235,.16);
  }
  .icon {
    width: 116px; height: 116px; margin: 0 auto 14px;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(76px 76px at 50% 42%, rgba(59,130,246,.10), transparent 70%), rgba(255,255,255,.5);
    border: 1px solid rgba(37,99,235,.12);
    border-radius: 12px;
  }
  .icon img { width: 92px; height: 92px; display: block; }
  .name { font-size: 16px; font-weight: 700; letter-spacing: 2px; color: #0F1B3D; }
  .name em { font-style: normal; font-weight: 500; font-size: 11px; letter-spacing: 2.5px; color: #2563EB; margin-left: 8px; }
  .cls {
    margin-top: 10px; font-size: 11px; letter-spacing: .5px;
    color: #1D4ED8;
    font-family: "JetBrains Mono", Consolas, monospace;
    background: rgba(255,255,255,.6); border: 1px solid rgba(37,99,235,.2);
    border-left: 2px solid #2563EB;
    padding: 4px 10px;
    display: inline-block;
  }
  .desc { margin-top: 9px; font-size: 11.5px; letter-spacing: 2.5px; color: rgba(15,27,61,.42); }
  footer {
    margin-top: 40px; font-size: 12px; letter-spacing: 3px; color: rgba(15,27,61,.5);
    display: flex; align-items: center; gap: 10px;
  }
  footer::before { content: '▮'; font-size: 10px; color: #2563EB; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="kicker">JOBHUB SYSTEM · V7</span>
    <h1>光标系统<i>ORIGAMI CURSOR</i></h1>
    <p class="sub">参考图风格：<b>立体折纸卡通</b>、纸飞机箭头 + 白面浅蓝面 + 深蓝轮廓、圆润可爱 —— 透明 PNG 光标，悬停任意卡片体验对应光标。</p>
  </header>

  <div class="grid" id="grid"></div>

  <footer>SYSTEM ASSETS: public/cursors/*.png · 32×32 · ORIGAMI 3D · CARTOON</footer>
</div>

<script>
const ITEMS = [
  ['arrow', '常规', 'Arrow', '.cursor-default', 'var(--cur-arrow), auto'],
  ['pointer', '可点击', 'Pointer', '.cursor-pointer', 'var(--cur-pointer), pointer'],
  ['text', '文本', 'Text', '.cursor-text', 'var(--cur-text), text'],
  ['copy', '复制', 'Copy', '.cursor-copy', 'var(--cur-copy), copy'],
  ['move', '移动', 'Move', '.cursor-move', 'var(--cur-move), move'],
  ['not-allowed', '禁止', 'Not Allowed', '.cursor-not-allowed', 'var(--cur-not-allowed), not-allowed'],
  ['grab', '抓取', 'Grab', '.cursor-grab', 'var(--cur-grab), grab'],
  ['grabbing', '握紧', 'Grabbing', '.cursor-grabbing', 'var(--cur-grabbing), grabbing'],
  ['progress', '进行中', 'Progress', '.cursor-progress', 'var(--cur-progress), progress'],
  ['wait', '等待', 'Wait', '.cursor-wait', 'var(--cur-wait), wait'],
  ['resize-ew', '横向缩放', 'EW', '.cursor-resize-ew', 'var(--cur-resize-ew), ew-resize'],
  ['resize-ns', '纵向缩放', 'NS', '.cursor-resize-ns', 'var(--cur-resize-ns), ns-resize'],
  ['resize-nesw', '斜向缩放', 'NESW', '.cursor-resize-nesw', 'var(--cur-resize-nesw), nesw-resize'],
  ['resize-nwse', '斜向缩放', 'NWSE', '.cursor-resize-nwse', 'var(--cur-resize-nwse), nwse-resize'],
  ['crosshair', '准星', 'Crosshair', '.cursor-crosshair', 'var(--cur-crosshair), crosshair'],
  ['zoom-in', '放大', 'Zoom In', '.cursor-zoom-in', 'var(--cur-zoom-in), zoom-in'],
  ['zoom-out', '缩小', 'Zoom Out', '.cursor-zoom-out', 'var(--cur-zoom-out), zoom-out'],
];
const grid = document.getElementById('grid');
for (const [file, cn, en, cls, css] of ITEMS) {
  const card = document.createElement('div');
  card.className = 'card';
  card.style.cursor = css;
  card.innerHTML =
    '<div class="icon"><img src="/cursors/' + file + '.png" alt="' + en + '"></div>' +
    '<div class="name">' + cn + '<em>' + en + '</em></div>' +
    '<div><span class="cls">' + cls + '</span></div>' +
    '<div class="desc">' + en + '</div>';
  grid.appendChild(card);
}
</script>
</body>
</html>
